  <text x="467" y="190" fill="#1c5f9c" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800">2027</text>
  <text x="152" y="226" fill="#18222f" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">IEEE MTT-S International Microwave Biomedical Conference</text>
  <text x="634" y="226" fill="#d50032" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800">Chicago</text>
