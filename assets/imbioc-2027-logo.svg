<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-labelledby="title desc">
  <title id="title">IMBioC 2027 conference logo</title>
  <desc id="desc">A draft IMBioC 2027 logo with microwave signal arcs, a DNA helix, and biomedical mark.</desc>
  <defs>
    <linearGradient id="waveGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#8aa441" />
      <stop offset="1" stop-color="#5c7d2b" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#102033" flood-opacity="0.16" />
    </filter>
  </defs>
  <rect width="820" height="260" fill="#ffffff" />
  <g filter="url(#softShadow)">
    <path d="M48 68a118 118 0 0 0 0 124" fill="none" stroke="url(#waveGradient)" stroke-width="18" />
    <path d="M82 50a154 154 0 0 0 0 160" fill="none" stroke="url(#waveGradient)" stroke-width="18" />
    <path d="M118 31a194 194 0 0 0 0 198" fill="none" stroke="url(#waveGradient)" stroke-width="18" />
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
