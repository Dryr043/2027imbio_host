    <path d="M152 37c-34 27-13 68-50 99s-13 68-45 91" stroke="#d9802a" stroke-width="8" />
    <path d="M112 72l44-20" stroke="#d9802a" stroke-width="5" />
    <path d="M124 99l42-19" stroke="#d9802a" stroke-width="5" />
    <path d="M111 129l54-23" stroke="#d9802a" stroke-width="5" />
    <path d="M80 166l62-27" stroke="#d9802a" stroke-width="5" />
    <path d="M59 199l61-28" stroke="#d9802a" stroke-width="5" />
  </g>
  <g transform="translate(248 28)" fill="#d50032">
    <circle cx="54" cy="54" r="20" />
    <circle cx="102" cy="54" r="20" />
    <circle cx="54" cy="102" r="20" />
    <circle cx="102" cy="102" r="20" />
    <rect x="66" y="39" width="24" height="78" rx="11" fill="#fff" />
    <rect x="39" y="66" width="78" height="24" rx="11" fill="#fff" />
