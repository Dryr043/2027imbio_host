<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">IMBioC 2027 conference logo</title>
  <desc id="desc">IMBioC 2027 logo inspired by the conference visual language: microwave arcs, DNA helix, and blue IMBioC text.</desc>
  <defs>
    <linearGradient id="arcGreen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#9ab754" />
      <stop offset="1" stop-color="#5f7f2f" />
    </linearGradient>
    <linearGradient id="dnaOrange" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d26d1c" />
      <stop offset="1" stop-color="#f2a13a" />
    </linearGradient>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M53 61c-22 25-22 73 0 98" stroke="url(#arcGreen)" stroke-width="13" />
    <path d="M83 43c-40 42-40 113 0 155" stroke="url(#arcGreen)" stroke-width="13" />
    <path d="M115 -6c-61 61-61 169 0 230" stroke="url(#arcGreen)" stroke-width="13" />
    <path d="M142 28c48 34 4 74 48 111 26 22 25 42 11 60" stroke="url(#dnaOrange)" stroke-width="6" />
    <path d="M194 22c-40 30-7 68-51 106-32 28-20 55 5 76" stroke="url(#dnaOrange)" stroke-width="6" />
    <path d="M151 44l38-18" stroke="#d97921" stroke-width="4" />
    <path d="M159 67l41-19" stroke="#d97921" stroke-width="4" />
    <path d="M159 91l37-17" stroke="#d97921" stroke-width="4" />
    <path d="M145 119l43-20" stroke="#d97921" stroke-width="4" />
    <path d="M133 148l48-22" stroke="#d97921" stroke-width="4" />
    <path d="M135 176l44-20" stroke="#d97921" stroke-width="4" />
  </g>

  <g transform="translate(535 26)">
    <rect x="0" y="0" width="70" height="12" fill="#d50032" />
    <rect x="0" y="22" width="70" height="12" fill="#d50032" />
    <rect x="0" y="44" width="70" height="12" fill="#d50032" />
    <rect x="79" y="0" width="28" height="12" fill="#9aa1a9" />
    <rect x="79" y="22" width="28" height="12" fill="#9aa1a9" />
    <rect x="79" y="44" width="28" height="12" fill="#9aa1a9" />
  </g>

  <g fill="#0716b5" font-family="Arial, Helvetica, sans-serif" font-weight="800">
    <text x="205" y="122" font-size="74" letter-spacing="-1">IMBioC</text>
    <text x="493" y="78" font-size="20">&#174;</text>
    <text x="210" y="174" font-size="42" letter-spacing="2">2027</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="800">
    <text x="340" y="174" fill="#d50032" font-size="30">Chicago</text>
  </g>

  <text x="207" y="205" fill="#1a2430" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">
    IEEE MTT-S International Microwave Biomedical Conference
  </text>
</svg>